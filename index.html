<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WeatherApp — текущая погода в Москве" />
    <title>WeatherApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page">
    <main class="weather-app">
      <header class="weather-app__header">
        <a class="weather-app__logo" href="/" aria-label="WeatherApp — на главную">
          <img src="images/Logo.svg" alt="WeatherApp" />
        </a>

        <form class="search" role="search">
          <label class="search__label" for="city-search">Поиск по городу</label>
          <input class="search__input" id="city-search" name="city" type="search" placeholder="Поиск по городу" autocomplete="off" />
          <img class="search__icon" src="icons/24/Group 2.svg" alt="" aria-hidden="true" />
        </form>
      </header>

      <div class="weather-app__content">
        <section class="weather" aria-labelledby="weather-city">
          <div class="weather__city">
            <h1 class="weather__city-name" id="weather-city">Москва</h1>
            <p class="weather__date">Суббота, 06 января</p>
            <time class="weather__time" datetime="11:29">11:29</time>
          </div>

          <div class="weather__temperature">
            <span class="weather__temperature-value">-7°</span>
          </div>

          <div class="weather__description">
            <div class="weather__condition">
              <img class="weather__icon" src="images/weather/time=day, state=broken clouds.svg" alt="" />
              <span>Облачно</span>
            </div>
            <p class="weather__feels-like">Ощущается как -11°</p>
          </div>
        </section>

        <section class="forecast" aria-label="Прогноз погоды">
          <div class="forecast__grid">
            <article class="forecast-card"></article>
            <article class="forecast-card"></article>
            <article class="forecast-card"></article>
            <article class="forecast-card"></article>
            <article class="forecast-card"></article>
            <article class="forecast-card"></article>
          </div>
        </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
